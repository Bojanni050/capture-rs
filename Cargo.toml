[package]
name = "capture"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
directories = "6.0.0"
image = "0.25.10"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
async-trait = "0.1.89"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
tokio-postgres = { version = "0.7.15", features = ["with-chrono-0_4"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tray-icon = "0.24.2"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
windows = { version = "0.62.2", features = ["Foundation", "Globalization", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Security_Cryptography", "Win32_UI_Accessibility", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_HiDpi"] }
windows-core = "0.62.2"
winreg = "0.56.0"
xcap = "0.9.8"
fastembed = "6.0.2"
reqwest = { version = "0.13.5", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
# Geen lto/codegen-units=1: die combinatie veroorzaakte een reproduceerbare
# heap-corruption crash (STATUS_HEAP_CORRUPTION, altijd binnen ~15s na start)
# die in een debug-build nooit optrad. De onderliggende race is niet
# gevonden, maar zonder deze twee instellingen draaide de app 40+ minuten
# probleemloos. Voeg ze niet terug zonder dit eerst te reproduceren en op te
# lossen.
strip = true
